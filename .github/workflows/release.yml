name: release

# Runs when release.bat pushes a version tag (vX.Y.Z), and also when a push to main changes the
# version in gradle.properties and that version has no GitHub Release yet. Either way the
# jar is tested on real Minecraft servers before anything is published.
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

permissions:
  contents: read

# This repo is private; builds are published to the public releases-only repo below, which is
# where the launcher downloads the mod from. Needs the RELEASES_TOKEN secret (fine-grained token
# with Contents: read and write on atlas-thedev/native-mod-releases).
env:
  RELEASES_REPO: atlas-thedev/native-mod-releases

jobs:
  check:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$(grep -E '^version *=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '\r ')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$file" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version $file"; exit 1
          fi
          echo "version=$file" >> "$GITHUB_OUTPUT"
          if gh release view "v$file" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$file already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and test
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: [check, test]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: native-client-jar
          path: dist
      - name: Write manifest
        run: |
          python3 scripts/make-manifest.py "dist/native-client-${{ needs.check.outputs.version }}.jar" \
            "${{ needs.check.outputs.version }}" "$RELEASES_REPO" dist/manifest.json
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          v="${{ needs.check.outputs.version }}"
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_TOKEN secret is not set"; exit 1; fi
          if gh release view "v$v" --repo "$RELEASES_REPO" >/dev/null 2>&1; then echo "v$v was published by a parallel run."; exit 0; fi
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          { echo "## What's changed"; git log --no-merges --pretty='* %s' ${prev:+$prev..}HEAD | head -n 40; } > notes.md
          gh release create "v$v" "dist/native-client-$v.jar" dist/manifest.json --repo "$RELEASES_REPO" \
            --title "Native Client $v" --notes-file notes.md --latest
